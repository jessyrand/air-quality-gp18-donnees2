name: Air Quality Backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Fetch history
        run: uv run python -m src.extract.fetch_history

      - name: Build clean dataset
        run: uv run python -m src.transform.build_clean

      - name: Build warehouse
        run: uv run python -m src.transform.build_warehouse